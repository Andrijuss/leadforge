<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Review Leadforge — Passelli</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; background:#eef0f3; color:#111827; }
  header { background:#111827; color:#fff; padding:22px 32px; display:flex; align-items:center; justify-content:space-between; }
  header h1 { font-size:19px; }
  header .sub { color:#9ca3af; font-size:13px; margin-top:4px; }
  header .badge { background:#a9743f; color:#fff; border-radius:20px; padding:6px 14px; font-size:12px; font-weight:600; }
  .wrap { display:grid; grid-template-columns:1fr 1fr; gap:0; height:calc(100vh - 92px); }
  .col { padding:16px; overflow:auto; }
  .col label { display:block; font-size:10px; text-transform:uppercase; letter-spacing:1.5px; color:#6b7280; margin-bottom:8px; }
  .col iframe { width:100%; height:100%; border:1px solid #e5e7eb; border-radius:8px; background:#fff; min-height:70vh; }
  @media (max-width:900px){ .wrap { grid-template-columns:1fr; height:auto; } .col iframe{ min-height:80vh; } }
</style>
</head>
<body>
  <header>
    <div>
      <h1>Review — Passelli Srl</h1>
      <div class="sub">email di outreach &middot; preventivo nuovo grafica &middot; per correzioni vai di nuovo in chat</div>
    </div>
    <span class="badge">bozza · non inviata</span>
  </header>
  <div class="wrap">
    <div class="col">
      <label>Email di outreach (email.html)</label>
      <iframe src="email.html"></iframe>
    </div>
    <div class="col">
      <label>Preventivo con nuova grafica (quote.pdf)</label>
      <iframe src="quote.pdf"></iframe>
    </div>
  </div>
</body>
</html>
