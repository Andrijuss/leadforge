<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{SUBJECT}}</title>
</head>
<body style="margin:0;padding:0;background:#f4f5f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f5f7;padding:24px 0;">
    <tr><td align="center">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,0.08);">
        <!-- Header -->
        <tr><td style="background:#111827;padding:28px 40px;">
          <div style="color:#ffffff;font-size:20px;font-weight:700;">{{AGENCY_NAME}}</div>
          <div style="color:#9ca3af;font-size:13px;margin-top:4px;">{{AGENCY_TAGLINE}}</div>
        </td></tr>
        <!-- Body -->
        <tr><td style="padding:36px 40px;color:#1f2937;font-size:15px;line-height:1.7;">
          {{BODY}}
        </td></tr>
        <!-- CTA -->
        <tr><td style="padding:0 40px 36px;">
          <a href="{{CTA_URL}}" style="display:inline-block;background:#2563eb;color:#ffffff;text-decoration:none;padding:14px 28px;border-radius:8px;font-weight:600;font-size:15px;">{{CTA_TEXT}}</a>
        </td></tr>
        <!-- Footer -->
        <tr><td style="background:#f9fafb;padding:20px 40px;color:#6b7280;font-size:12px;line-height:1.6;border-top:1px solid #e5e7eb;">
          {{AGENCY_NAME}} &middot; {{AGENCY_WEBSITE}} &middot; {{AGENCY_EMAIL}}<br/>
          <span style="color:#9ca3af;">Se non desideri ricevere email, scrivici e non ti contatteremo più.</span>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
